# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: etherfi-cash-explorer
description: Destination top-up and settled-spend ledger for Ether.fi Cash
schema: ./schema.graphql
handlers: ./src/handlers
address_format: lowercase
rollback_on_reorg: true
field_selection:
  transaction_fields:
    - hash
    - transactionIndex

contracts:
  - name: TopUpDest
    abi_file_path: ./abis/top-up-dest.json
    events:
      - event: TopUp
  - name: CashEventEmitter
    abi_file_path: ./abis/cash-event-emitter.json
    events:
      - event: WithdrawalRequested
      - event: WithdrawalAmountUpdated
      - event: WithdrawalCancelled
      - event: WithdrawalProcessed
      - event: RepayDebtManager
      - event: Repay
      - event: RepayLendTokenAmount
      - event: LendOptOutRequested
      - event: LendOptOutExecuted
      - event: LendOptedIn
      - event: SpendingLimitChanged
      - event: ModeSet
      - event: Spend
      - event: CollateralResupplied
      - event: LendSupplyFailed
      - event: LendBorrowed
      - event: Cashback
      - event: PendingCashbackCleared
      - event: SafeTiersSet
      - event: TierCashbackPercentageSet
      - event: CashbackSplitToSafeBpsSet
      - event: DelaysSet
      - event: SettlementDispatcheUpdated
      - event: LendGatewaySet
      - event: WithdrawTokensConfigured
      - event: ModulesCanRequestWithdrawConfigured
  - name: DebtManager
    abi_file_path: ./abis/debt-manager.json
    events:
      - event: Supplied
      - event: Borrowed
      - event: Repaid
      - event: Liquidated
      - event: InterestIndexUpdated
  - name: DebtManagerLegacy
    abi_file_path: ./abis/debt-manager.json
    events:
      - event: Supplied
      - event: Borrowed
      - event: Repaid
      - event: Liquidated
      - event: InterestIndexUpdated
  # Verified against etherfi-protocol/cash-v3 deployment records and the
  # pinned etherfi-protocol/aave-v4 ISpoke source. These subscriptions were
  # added after this indexer's original launch; replay is required to backfill.
  - name: LendGateway
    abi_file_path: ./abis/lend-gateway.json
    events:
      - event: ReserveRegistered
      - event: ReserveDeregistered
      - event: PositionManagerApproved
      - event: Supplied
      - event: Withdrawn
      - event: Borrowed
      - event: Repaid
      - event: CollateralUsageSet
  - name: AaveV4Spoke
    abi_file_path: ./abis/aave-v4-spoke.json
    events:
      - event: AddReserve
      - event: Supply
      - event: Withdraw
      - event: Borrow
      - event: Repay
      - event: LiquidationCall
      - event: ReportDeficit
      - event: SetUsingAsCollateral
      - event: SetUserPositionManager
  - name: RampVolumeEmitter
    abi_file_path: ./abis/ramp-volume.json
    events:
      - event: RampVolume
  - name: EurUsdOracle
    abi_file_path: ./abis/chainlink-aggregator.json
    events:
      - event: AnswerUpdated
  - name: EtherFiSafeFactory
    abi_file_path: ./abis/beacon-factory.json
    events:
      - event: BeaconProxyDeployed
  - name: UserSafeFactory
    abi_file_path: ./abis/legacy-safe-factory.json
    events:
      - event: UserSafeDeployed
  # Addresses registered under this contract are Safe addresses. Wildcard
  # Transfer matching uses them only as indexed from/to topic filters; the
  # event emitter itself remains the ERC-20 token contract.
  - name: TrackedSafeTransfer
    abi_file_path: ./abis/erc20.json
    events:
      - event: Transfer
  # The legacy Scroll emitter proxy was upgraded in-place, so this address can
  # emit both the pre-upgrade and current Spend signatures.
  - name: ScrollCashEmitter
    events:
      - event: "Spend(address indexed safe, bytes32 indexed txId, uint8 indexed binSponsor, address[] tokens, uint256[] amounts, uint256[] amountInUsd, uint256 totalUsdAmt, uint8 mode)"
        name: CurrentSpend
      - event: "Spend(address indexed userSafe, address indexed token, uint256 amount, uint256 amountInUsd, uint8 mode)"
        name: LegacySpend
  - name: LegacyTopUpDest
    abi_file_path: ./abis/legacy-top-up-dest.json
    events:
      - event: TopUp
      - event: TopUpBatch

# These floors precede the known destination deployments. Replace them with
# independently verified contract-specific creation blocks before production.
