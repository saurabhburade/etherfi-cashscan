  destinationBalance: BigInt!
  destinationInflow: BigInt!
  destinationOutflow: BigInt!
  suppliedCount: BigInt!
  suppliedAmount: BigInt!
  borrowedCount: BigInt!
  borrowedAmount: BigInt!
  borrowedUsd: BigInt!
  repaidCount: BigInt!
  repaidAmount: BigInt!
  repaidUsd: BigInt!
  latestSpendPriceUsdE18: BigInt!
  latestSpendPriceStatus: String!
  latestSpendAt: Timestamp!
  latestSpendBlockNumber: BigInt!
  latestSpendLogIndex: Int!
  latestSpendValuationId: String!
  updatedAt: Timestamp!
  updatedBlock: BigInt!
