# order is timestamp DESC, chainId ASC, blockNumber DESC, logIndex DESC, id ASC.
type ProtocolEvent
  @index(
    fields: [["timestamp", "DESC"], ["chainId", "ASC"], ["blockNumber", "DESC"], ["logIndex", "DESC"], ["id", "ASC"]]
  )
  @index(
    fields: [["chainId", "ASC"], ["timestamp", "DESC"], ["blockNumber", "DESC"], ["logIndex", "DESC"], ["id", "ASC"]]
  )
  @index(
    fields: [
      ["eventType", "ASC"]
      ["timestamp", "DESC"]
      ["chainId", "ASC"]
      ["blockNumber", "DESC"]
      ["logIndex", "DESC"]
      ["id", "ASC"]
    ]
  )
  @index(
    fields: [
      ["chainId", "ASC"]
      ["eventType", "ASC"]
      ["timestamp", "DESC"]
      ["blockNumber", "DESC"]
      ["logIndex", "DESC"]
      ["id", "ASC"]
    ]
  )
{
  id: ID!
  chainId: Int!
  # Exact explorer filters use compact single-column indexes. The address
  # predicates are combined with OR, so independent btrees enable BitmapOr.
  contractAddress: String! @index
  eventType: String!
  actor: String! @index
  tokenAddress: String! @index
  amount: BigInt!
  amountUsd: BigInt!
  blockNumber: BigInt! @index
  timestamp: Timestamp!
  transactionHash: String! @index
  logIndex: Int!
  metadata: String!
}

