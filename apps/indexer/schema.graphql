# canonical history; this row makes summary reads constant-size.
type TokenAnalyticsMetric {
  id: ID!
  chainId: Int! @index
  tokenAddress: String! @index
  spendCount: BigInt!
  spendAmount: BigInt!
  spendUsd: BigInt!
  topUpCount: BigInt!
